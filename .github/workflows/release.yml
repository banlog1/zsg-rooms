name: Release Mods

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and stage release artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x gradlew
          ./gradlew -p replay-prototype clean build fetchReplayModReference
          ./gradlew clean test build -Pmod_version="$VERSION"
          ./gradlew -p replay-viewer clean build
          ./gradlew stageRelease -Pmod_version="$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_FLAGS=()
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          NOTES="build/release/notes.md"
          if [[ -f "docs/releases/$VERSION.md" ]]; then
            cp "docs/releases/$VERSION.md" "$NOTES"
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" --jq '.body' > "$NOTES"
          fi
          printf '\n\n' >> "$NOTES"
          cat build/release/release-details.md >> "$NOTES"
          gh release create "$GITHUB_REF_NAME" build/release/*.jar build/release/*.sha256 \
            --title "ZSG Rooms $VERSION" --notes-file "$NOTES" "${RELEASE_FLAGS[@]}"
