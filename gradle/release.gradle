import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.util.zip.ZipFile

def packTest = tasks.register('easyInstallPackTest', Exec) {
    group = 'verification'
    description = 'Tests the easy-install manifest and privacy-safe defaults (Node.js 22+).'
    commandLine 'node', '--test', 'scripts/Build-EasyInstallPack.test.mjs'
}

def packMetadata = tasks.register('easyInstallMetadata', Exec) {
    dependsOn tasks.named('build'), packTest
    inputs.files('pack/mods.lock.json', 'scripts/Build-EasyInstallPack.mjs',
            "build/libs/zsg-rooms-${project.version}.jar",
            "replay-viewer/build/libs/zsg-replay-viewer-${replayViewerVersion}.jar")
    inputs.property 'coreVersion', project.version.toString()
    inputs.property 'viewerVersion', replayViewerVersion.toString()
    outputs.dir layout.buildDirectory.dir('easy-install-metadata')
    commandLine 'node', 'scripts/Build-EasyInstallPack.mjs', '--build',
            project.version.toString(), replayViewerVersion.toString()
}

// MultiMC detects modrinth.index.json by content, including when the archive ends in .zip.
def packFiles = ['modrinth.index.json', 'overrides/config/replaymod.json',
                 'overrides/config/zsg-rooms-replay.properties', 'overrides/ZSG-ROOMS-SETUP.txt']
def packs = ['zip', 'mrpack'].collect { extension ->
    tasks.register(extension == 'zip' ? 'easyInstallPack' : 'easyInstallMrpack', Zip) {
        dependsOn packMetadata
        from(layout.buildDirectory.dir('easy-install-metadata')) { include packFiles }
        archiveFileName = "zsg-rooms-multimc.${extension}"
        destinationDirectory = layout.buildDirectory.dir('distributions')
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        doLast {
            new ZipFile(archiveFile.get().asFile).withCloseable { zip ->
                def names = zip.entries().toList().findAll { !it.directory }*.name
                if (names.toSet() != packFiles.toSet() || names.size() != packFiles.size()) {
                    throw new GradleException('Unexpected or missing easy-install pack contents')
                }
                def index = zip.getInputStream(zip.getEntry('modrinth.index.json')).withCloseable {
                    new JsonSlurper().parse(it, 'UTF-8')
                }
                if (index.files.size() != 26 || index.versionId != project.version.toString()) {
                    throw new GradleException('Incorrect easy-install release manifest')
                }
            }
        }
    }
}

// Build the companion separately first. Stage only explicitly named, validated artifacts.
def galleryPack = tasks.register('filterGalleryPack', Zip) {
    from('optional-assets/filter-gallery') {
        include 'pack.mcmeta', 'assets/zsg-rooms/textures/gui/filters/*.png', 'assets/zsg-rooms/textures/gui/loading/*.png'
    }
    archiveFileName = 'zsg-rooms-filter-gallery.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
}

tasks.register('stageRelease', Sync) {
    dependsOn tasks.named('build'), galleryPack, packs
    def coreJar = file("build/libs/zsg-rooms-${project.version}.jar")
    def viewerJar = file("replay-viewer/build/libs/zsg-replay-viewer-${replayViewerVersion}.jar")
    def viewerSources = file("replay-viewer/build/libs/zsg-replay-viewer-${replayViewerVersion}-sources.jar")
    def destination = layout.buildDirectory.dir('release')
    from(coreJar, viewerJar, viewerSources)
    from(galleryPack.flatMap { it.archiveFile })
    packs.each { pack -> from(pack.flatMap { it.archiveFile }) }
    into(destination)
    outputs.upToDateWhen { false }

    doFirst {
        [coreJar, viewerJar, viewerSources].each { artifact ->
            if (!artifact.isFile()) throw new GradleException("Build both mods before staging: missing ${artifact.name}")
        }
        [[coreJar, 'zsg-rooms', project.version.toString(), 'CC0-1.0'],
         [viewerJar, 'zsg-replay-viewer', replayViewerVersion.toString(), 'GPL-3.0-or-later']].each { specification ->
            new ZipFile(specification[0]).withCloseable { zip ->
                def metadata = zip.getEntry('fabric.mod.json')
                if (metadata == null) throw new GradleException('Missing mod metadata')
                def mod = zip.getInputStream(metadata).withCloseable { new JsonSlurper().parse(it, 'UTF-8') }
                if (mod.id != specification[1] || mod.version != specification[2] || mod.license != specification[3]) {
                    throw new GradleException("Artifact metadata mismatch: ${specification[0].name}")
                }
                if (mod.id == 'zsg-replay-viewer' && mod.depends.replaymod != '1.16.1-2.6.27') {
                    throw new GradleException('Update release instructions when changing ReplayMod compatibility')
                }
                if (mod.id == 'zsg-rooms' && (mod.depends.replaymod || mod.depends.'zsg-replay-viewer')) {
                    throw new GradleException('Playback mods must remain optional for racing')
                }
                def entries = zip.entries().toList()*.name
                if (!entries.any { it.startsWith('LICENSE') }
                        || entries.any { it.startsWith('com/replaymod/') || it.contains('replaymod-1.16.1-2.6.27.jar') }) {
                    throw new GradleException("Missing license or bundled ReplayMod: ${specification[0].name}")
                }
            }
        }
        new ZipFile(viewerSources).withCloseable { zip ->
            if (zip.getEntry('LICENSE') == null || zip.getEntry('zsgrooms/replayviewer/ReplayViewer.java') == null) {
                throw new GradleException('Companion source archive must include its source and license')
            }
        }
    }

    doLast {
        def hash = { File artifact ->
            def digest = MessageDigest.getInstance('SHA-256')
            artifact.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int count
                while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
            }
            digest.digest().encodeHex().toString()
        }
        File output = destination.get().asFile
        // Older installed updaters accept any .sha256 asset. Publish exactly one, for the core.
        new File(output, coreJar.name + '.sha256').setText("${hash(coreJar)}  ${coreJar.name}\n", 'UTF-8')
        new File(output, 'release-installation.md').setText("""## Install With MultiMC

1. In MultiMC, select **Add Instance > Import from ZIP**.
2. Copy the URL below into the import box, then select **OK**. There is no need to download or extract the ZIP yourself.

```text
https://github.com/banlog1/zsg-rooms/releases/download/v${project.version}/zsg-rooms-multimc.zip
```

3. Wait for installation to finish, select **Java 17** in the instance's Java settings, and launch. Open **ZSG Rooms** from the title screen.

Use a current MultiMC version with Modrinth-pack support. The import installs Minecraft 1.16.1, Fabric Loader 0.19.3 and the 26-mod racing/replay suite, including Rooms, Replay Viewer, ReplayMod and SpeedRunIGT. Internet access and your own Minecraft account are required.

Recording is optional: enable it under **Settings > Recording**. ReplayMod automatic recording is already disabled to avoid recording twice. This is a Rooms/practice suite, not a certified leaderboard-legal pack.
""", 'UTF-8')
        new File(output, 'release-details.md').setText("""## Manual Downloads

Already using Rooms? The in-game updater updates Rooms and an already-installed Replay Viewer. It does not update ReplayMod or the other mods in the pack.

- **${coreJar.name}**: the main mod. ReplayMod is not required for racing or recording.
- **${viewerJar.name}**: optional playback controls. Install alongside [ReplayMod **1.16.1-2.6.27**](https://www.replaymod.com/download/), on Minecraft 1.16.1 with Fabric Loader 0.19.3+.
- **${viewerSources.name}**: viewer source, not an installable mod. GPL-3.0-or-later; the core remains CC0-1.0. Full build scripts are in the tagged source archive.
- **zsg-rooms-filter-gallery.zip**: optional picker and loading artwork. Put it in `resourcepacks` and enable it in Minecraft, not in `mods`. The images are not bundled in either mod.
- **zsg-rooms-multimc.mrpack**: the same installation pack for other compatible launchers.

For manual installs, disable ReplayMod's Record Singleplayer, Record Server, and Automatic Recording options before enabling ZSG recording. SpeedRunIGT is needed during recording for RTA/IGT data.

[Replay setup and controls](https://github.com/banlog1/zsg-rooms/blob/v${project.version}/replay-viewer/README.md).

<details>
<summary>Optional Download SHA-256</summary>

```text
${hash(viewerJar)}  ${viewerJar.name}
${hash(viewerSources)}  ${viewerSources.name}
${hash(new File(output, 'zsg-rooms-filter-gallery.zip'))}  zsg-rooms-filter-gallery.zip
${hash(new File(output, 'zsg-rooms-multimc.zip'))}  zsg-rooms-multimc.zip
${hash(new File(output, 'zsg-rooms-multimc.mrpack'))}  zsg-rooms-multimc.mrpack
```

</details>
""", 'UTF-8')
    }
}
