import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.util.zip.ZipFile

// Build the companion separately first. Stage only explicitly named, validated artifacts.
tasks.register('stageRelease', Sync) {
    dependsOn tasks.named('build')
    def coreJar = file("build/libs/zsg-rooms-${project.version}.jar")
    def viewerJar = file("replay-viewer/build/libs/zsg-replay-viewer-${replayViewerVersion}.jar")
    def viewerSources = file("replay-viewer/build/libs/zsg-replay-viewer-${replayViewerVersion}-sources.jar")
    def destination = layout.buildDirectory.dir('release')
    from(coreJar, viewerJar, viewerSources)
    into(destination)
    outputs.upToDateWhen { false }

    doFirst {
        [coreJar, viewerJar, viewerSources].each { artifact ->
            if (!artifact.isFile()) throw new GradleException("Build both mods before staging: missing ${artifact.name}")
        }
        [[coreJar, 'zsg-rooms', project.version.toString(), 'CC0-1.0'],
         [viewerJar, 'zsg-replay-viewer', replayViewerVersion.toString(), 'GPL-3.0-or-later']].each { specification ->
            new ZipFile(specification[0]).withCloseable { zip ->
                def metadata = zip.getEntry('fabric.mod.json')
                if (metadata == null) throw new GradleException('Missing mod metadata')
                def mod = zip.getInputStream(metadata).withCloseable { new JsonSlurper().parse(it, 'UTF-8') }
                if (mod.id != specification[1] || mod.version != specification[2] || mod.license != specification[3]) {
                    throw new GradleException("Artifact metadata mismatch: ${specification[0].name}")
                }
                if (mod.id == 'zsg-replay-viewer' && mod.depends.replaymod != '1.16.1-2.6.27') {
                    throw new GradleException('Update release instructions when changing ReplayMod compatibility')
                }
                if (mod.id == 'zsg-rooms' && (mod.depends.replaymod || mod.depends.'zsg-replay-viewer')) {
                    throw new GradleException('Playback mods must remain optional for racing')
                }
                def entries = zip.entries().toList()*.name
                if (!entries.any { it.startsWith('LICENSE') }
                        || entries.any { it.startsWith('com/replaymod/') || it.contains('replaymod-1.16.1-2.6.27.jar') }) {
                    throw new GradleException("Missing license or bundled ReplayMod: ${specification[0].name}")
                }
            }
        }
        new ZipFile(viewerSources).withCloseable { zip ->
            if (zip.getEntry('LICENSE') == null || zip.getEntry('zsgrooms/replayviewer/ReplayViewer.java') == null) {
                throw new GradleException('Companion source archive must include its source and license')
            }
        }
    }

    doLast {
        def hash = { File artifact ->
            def digest = MessageDigest.getInstance('SHA-256')
            artifact.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int count
                while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
            }
            digest.digest().encodeHex().toString()
        }
        File output = destination.get().asFile
        // Older installed updaters accept any .sha256 asset. Publish exactly one, for the core.
        new File(output, coreJar.name + '.sha256').setText("${hash(coreJar)}  ${coreJar.name}\n", 'UTF-8')
        new File(output, 'release-details.md').setText("""## Downloads

- **${coreJar.name}**: the main mod. ReplayMod is not required for racing or recording.
- **${viewerJar.name}**: optional playback controls. Install alongside [ReplayMod **1.16.1-2.6.27**](https://www.replaymod.com/download/), on Minecraft 1.16.1 with Fabric Loader 0.19.3+.
- **${viewerSources.name}**: viewer source, not an installable mod. GPL-3.0-or-later; the core remains CC0-1.0. Full build scripts are in the tagged source archive.

Enable recording under **Settings > Replays**. If ReplayMod is installed, disable its Record Singleplayer, Record Server, and Automatic Recording options first. SpeedRunIGT is needed during recording for RTA/IGT data. Player switching currently uses manually shared files.

The in-game updater updates the core only. Install the viewer and ReplayMod separately. [Replay setup and controls](https://github.com/banlog1/zsg-rooms/blob/v${project.version}/replay-viewer/README.md).

<details>
<summary>Companion SHA-256</summary>

```text
${hash(viewerJar)}  ${viewerJar.name}
${hash(viewerSources)}  ${viewerSources.name}
```

</details>
""", 'UTF-8')
    }
}
