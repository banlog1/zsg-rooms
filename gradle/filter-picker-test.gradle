// Fabric API 0.18 reads one mod root, so keep dev resources beside classes.
tasks.named('compileJava') { destinationDirectory = layout.buildDirectory.dir('filter-picker-main') }
sourceSets.main.output.classesDirs.setFrom(layout.buildDirectory.dir('filter-picker-main'))
sourceSets.main.output.resourcesDir = tasks.named('compileJava').get().destinationDirectory.get().asFile
tasks.named('processResources') { destinationDir = sourceSets.main.output.resourcesDir }

sourceSets {
    filterPickerTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
if (project.hasProperty('loadingWorldPreview')) {
    dependencies {
        modRuntimeOnly files('run/replay-playback-test/reference-mods/worldpreview-6.3.1+1.16-1.16.1.jar')
        modRuntimeOnly fileTree(dir: 'libs', include: 'speedrunapi-*.jar')
    }
}
if (project.hasProperty('roomWorldCreationSmoke')) {
    dependencies {
        modRuntimeOnly files('libs/atum-2.7.2+1.16-1.16.1.jar')
        modRuntimeOnly fileTree(dir: 'libs', include: 'speedrunapi-*.jar')
    }
}
if (project.hasProperty('settingsImportSmoke')) {
    dependencies {
        modRuntimeOnly files('run/replay-playback-test/reference-mods/standardsettings-2.3+1.16-1.16.1.jar')
        modRuntimeOnly files('replay-prototype/build/reference/replaymod-1.16.1-2.6.27.jar')
        modRuntimeOnly fileTree(dir: 'libs', include: 'speedrunapi-*.jar')
    }
}
loom {
    mods {
        'zsg-rooms' { sourceSet sourceSets.main }
        'zsg-filter-picker-test' { sourceSet sourceSets.filterPickerTest }
    }
    runs {
        filterPickerTest {
            client()
            source sourceSets.filterPickerTest
            runDir 'run/filter-picker-test'
            vmArg "-Dzsgrooms.seedVisualSmoke=${project.hasProperty('seedVisualSmoke')}"
            vmArg "-Dzsgrooms.aaModeSmoke=${project.hasProperty('aaModeSmoke')}"
            vmArg "-Dzsgrooms.sequenceSmoke=${project.hasProperty('sequenceSmoke')}"
            vmArg "-Dzsgrooms.raceFormatSmoke=${project.hasProperty('raceFormatSmoke')}"
            vmArg "-Dzsgrooms.tournamentSmoke=${project.hasProperty('tournamentSmoke')}"
            vmArg "-Dzsgrooms.tournamentRaceSmoke=${project.hasProperty('tournamentRaceSmoke')}"
            vmArg "-Dzsgrooms.lobbyRulesSmoke=${project.hasProperty('lobbyRulesSmoke')}"
            vmArg "-Dzsgrooms.spawnPreparationSmoke=${project.hasProperty('spawnPreparationSmoke') || project.hasProperty('bankStructureSmoke')}"
            vmArg "-Dzsgrooms.bankStructureSmoke=${project.hasProperty('bankStructureSmoke')}"
            vmArg "-Dzsgrooms.templeSpawnSmoke=${project.hasProperty('templeSpawnSmoke')}"
            vmArg "-Dzsgrooms.gameRuleAuditSmoke=${project.hasProperty('gameRuleAuditSmoke')}"
            vmArg "-Dzsgrooms.roomWorldCreationSmoke=${project.hasProperty('roomWorldCreationSmoke')}"
            vmArg "-Dzsgrooms.loadingPositionSmoke=${project.hasProperty('loadingPositionSmoke')}"
            vmArg "-Dzsgrooms.personalSettingsSmoke=${project.hasProperty('personalSettingsSmoke')}"
            vmArg "-Dzsgrooms.tutorialSmoke=${project.hasProperty('tutorialSmoke')}"
            vmArg "-Dzsgrooms.roomEntrySmoke=${project.hasProperty('roomEntrySmoke')}"
            vmArg "-Dzsgrooms.settingsImportSmoke=${project.hasProperty('settingsImportSmoke')}"
            vmArg "-Dzsgrooms.settingsImportApplySmoke=${project.hasProperty('settingsImportApplySmoke')}"
            if (project.hasProperty('settingsImportDiscoveryFrom'))
                vmArg "-Dzsgrooms.settingsImportDiscoveryFrom=${project.property('settingsImportDiscoveryFrom')}"
        }
    }
}
tasks.named('runFilterPickerTest') {
    if (project.hasProperty('settingsImportSmoke') || project.hasProperty('tutorialSmoke') || project.hasProperty('roomEntrySmoke')) environment 'ALSOFT_DRIVERS', 'null'
    if (project.hasProperty('personalSettingsSmoke') || project.hasProperty('settingsImportSmoke') || project.hasProperty('tutorialSmoke') || project.hasProperty('roomEntrySmoke')) {
        maxHeapSize = '2g'
        jvmArgs '-XX:ActiveProcessorCount=4'
    }
    if (project.hasProperty('testJava')) executable = project.property('testJava')
    if (project.hasProperty('roomWorldCreationSmoke') || project.hasProperty('gameRuleAuditSmoke') || project.hasProperty('templeSpawnSmoke') || project.hasProperty('bankStructureSmoke') || project.hasProperty('sequenceSmoke') || project.hasProperty('raceFormatSmoke') || project.hasProperty('tournamentSmoke') || project.hasProperty('tournamentRaceSmoke') || project.hasProperty('loadingPositionSmoke') || project.hasProperty('seedVisualSmoke')) {
        maxHeapSize = '2g'
        jvmArgs "-XX:ActiveProcessorCount=${project.findProperty('smokeProcessors') ?: 4}", '-Xlog:gc:file=sequence-gc.log'
    }
    doFirst {
        ext.startedAt = System.currentTimeMillis()
        if (project.hasProperty('tutorialSmoke')) delete file('run/filter-picker-test/config/zsg-rooms-tutorial.properties')
        def pack = file('build/distributions/zsg-rooms-filter-gallery.zip')
        if (!pack.exists()) throw new GradleException('Build the image pack with scripts/Build-FilterGalleryPack.ps1 first')
        copy { from pack; into 'run/filter-picker-test/resourcepacks' }
        file('run/filter-picker-test/options.txt').text = 'resourcePacks:["file/zsg-rooms-filter-gallery.zip"]\nguiScale:2\nmaxFps:60\npauseOnLostFocus:false\nsoundCategory_master:0.0\nsoundCategory_music:0.0\n'
    }
    doLast {
        def log = file('run/filter-picker-test/logs/latest.log')
        if (!log.exists() || log.lastModified() < startedAt || !log.text.contains('[FilterPickerSmoke] PASS:')
                || log.text.contains('[SeedVisualSmoke] FAILED') || log.text.contains('[LobbyRulesSmoke] FAILED')
                || log.text.contains('[SpawnPreparationSmoke] FAILED') || log.text.contains('[LoadingPositionSmoke] FAILED')
                || log.text.contains('[TempleSpawnSmoke] FAILED')
                || log.text.contains('[RoomWorldCreationSmoke] FAILED')
                || log.text.contains('[RaceSequenceSmoke] FAILED')
                || log.text.contains('[RaceFormatSmoke] FAILED')
                || log.text.contains('[TournamentSmoke] FAILED')
                || log.text.contains('[PersonalSettingsSmoke] FAILED')
                || log.text.contains('[SettingsImportSmoke] FAILED')
                || log.text.contains('[TutorialSmoke] FAILED')
                || log.text.contains('[RoomEntrySmoke] FAILED')
                || log.text.contains('[TournamentRaceSmoke] FAILED')
                || log.text.contains('[AaModeSmoke] FAILED')) {
            throw new GradleException('Filter picker smoke test failed; see run/filter-picker-test/logs/latest.log')
        }
        if (project.hasProperty('gameRuleAuditSmoke') && !log.text.contains('[GameRuleAudit] COMPLETE')) {
            throw new GradleException('Game-rule audit did not complete')
        }
    }
}
