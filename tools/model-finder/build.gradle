plugins { id 'java' }

repositories {
    maven { url = 'https://maven.seedfinding.com' }
    mavenCentral()
}

// Operator-only tool. Nothing from this project is packaged in the Minecraft mod.
java { sourceCompatibility = JavaVersion.VERSION_16; targetCompatibility = JavaVersion.VERSION_16 }
def village = file('../../run/filter-reference/VillageGenerator')
def bastion = file('../../run/filter-reference/BastionGenerator')
def zsg = file('../../run/filter-reference/ZigSeedGlitchless')
def preparedVillage = layout.buildDirectory.dir('generated/sources/village')
sourceSets.main.java.srcDir preparedVillage
sourceSets.main.java.exclude 'profotoce59/Main.java', 'profotoce59/thread/**'
// Keep ZSG's dependency versions isolated from the existing village model.
sourceSets {
    nether {
        java.srcDir new File(bastion, 'src/main/java')
        java.exclude 'Xinyuiii/properties/Main.java'
        java.srcDir '../../src/main/java'
        java.include 'zsgrooms/model/nether/**', 'Xinyuiii/**', 'zsgrooms/modid/filter/BastionLayoutChecks.java'
    }
    netherTest {
        java.srcDir new File(zsg, 'ZSGJavaBits/src/main/java')
        java.include 'zsgrooms/model/nether/**', 'xyz/duncanruns/zsg/javabits/ZSGJavaBits.java'
        compileClasspath += sourceSets.nether.output
        runtimeClasspath += sourceSets.nether.output
    }
}
configurations.netherTestImplementation.extendsFrom configurations.netherImplementation, configurations.testImplementation
configurations.netherTestRuntimeOnly.extendsFrom configurations.testRuntimeOnly
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    ['mc_math:1.171.0', 'mc_seed:1.171.2', 'mc_core:1.194.0', 'mc_noise:1.171.1',
     'mc_biome:1.171.1', 'mc_terrain:1.171.1', 'mc_feature:1.171.5'].each {
        implementation("com.seedfinding:$it") { transitive = false }
    }
    ['mc_math:1.171.0', 'mc_seed:1.171.1', 'mc_core:1.200.1', 'mc_noise:1.171.1',
     'mc_biome:1.171.1', 'mc_terrain:1.171.1', 'mc_reversal:1.171.1', 'mc_feature:1.171.9'].each {
        netherImplementation("com.seedfinding:$it") { transitive = false }
    }
}
tasks.named('test') {
    useJUnitPlatform()
    workingDir = file('../..')
    maxHeapSize = '1G'
    inputs.files(fileTree('../../run/filter-worker') {
        include 'seed-finder.exe', 'model-test.exe', 'surface-test.exe', 'surface-query-test.exe'
    })
}
tasks.register('checkVillageRevision') {
    doLast {
        def revision = providers.exec { commandLine 'git', '-C', village, 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim()
        def dirty = providers.exec { commandLine 'git', '-C', village, 'status', '--porcelain', '--untracked-files=all' }.standardOutput.asText.get().trim()
        if (revision != 'ee9e0c6c82aeac3fef9b1ffa3f452a2a1eae6339' || dirty) {
            throw new GradleException('Use the clean, pinned VillageGenerator checkout documented in MODEL_SEED_FINDER.md')
        }
    }
}
tasks.register('prepareVillageSources', Sync) {
    dependsOn 'checkVillageRevision'
    def corrections = file('patches/village-1.16.1-corrections.patch')
    inputs.file corrections
    from new File(village, 'src/main/java')
    into preparedVillage
    doLast {
        // Patch a generated copy, leaving the pinned upstream checkout verifiable.
        def workspace = file('../..')
        def destination = workspace.toPath().relativize(preparedVillage.get().asFile.toPath()).toString().replace('\\', '/')
        providers.exec {
            workingDir workspace
            commandLine 'git', 'apply', '--no-index', '--ignore-space-change', "--directory=${destination}", corrections.absolutePath
        }.result.get().assertNormalExitValue()
    }
}
tasks.named('compileJava') { dependsOn 'prepareVillageSources'; options.encoding = 'UTF-8' }
tasks.register('checkNetherRevisions') {
    doLast {
        [(bastion): '9cccd19863e941d2dc8d2820037c48d49fe7d526',
         (zsg): '073e1d1f3150213c7c3787eda7ef8106cb789817'].each { directory, pin ->
            def revision = providers.exec { commandLine 'git', '-C', directory, 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim()
            def dirty = providers.exec { commandLine 'git', '-C', directory, 'status', '--porcelain', '--untracked-files=all' }.standardOutput.asText.get().trim()
            if (revision != pin || dirty) throw new GradleException('Use clean pinned ZSG and BastionGenerator checkouts')
        }
    }
}
tasks.named('compileNetherJava') { dependsOn 'checkNetherRevisions'; options.encoding = 'UTF-8' }
tasks.named('compileNetherTestJava') { dependsOn 'checkNetherRevisions'; options.encoding = 'UTF-8' }
tasks.register('netherTest', Test) {
    testClassesDirs = sourceSets.netherTest.output.classesDirs
    classpath = sourceSets.netherTest.runtimeClasspath
    useJUnitPlatform()
    maxHeapSize = '1G'
}
tasks.register('verifyStandaloneDependencies') {
    doLast {
        (configurations.runtimeClasspath.files + configurations.netherRuntimeClasspath.files).each { dependency ->
            def prohibited = zipTree(dependency).matching {
                include 'net/minecraft/**/*.class', 'net/fabricmc/**/*.class'
            }
            if (!prohibited.isEmpty()) throw new GradleException('Game runtime found in standalone model dependencies')
        }
    }
}
tasks.named('check') { dependsOn 'verifyStandaloneDependencies', 'netherTest' }
tasks.register('installModelFinder', Sync) {
    dependsOn 'classes', 'netherClasses', 'verifyStandaloneDependencies'
    into '../../run/model-finder'
    from(sourceSets.main.output) { into 'classes' }
    from(configurations.runtimeClasspath) { into 'lib' }
    from(sourceSets.nether.output) { into 'nether/classes' }
    from(configurations.netherRuntimeClasspath) { into 'nether/lib' }
}
