plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

loom {
	runs {
		replayPrototype {
			client()
			name = "Replay Recording Prototype"
			runDir = "run/replay-prototype"
			vmArg "-Dzsgrooms.replayPrototype.smokeTest=${project.findProperty('replaySmoke') ?: false}"
			vmArg "-Dzsgrooms.replayPrototype.smokeEnd=${project.findProperty('replayEnd') ?: 'quit'}"
			vmArg "-Dzsgrooms.replayPrototype.smokeResets=${project.findProperty('replayResets') ?: 0}"
			vmArg "-Dzsgrooms.replayPrototype.smokePerformance=${project.findProperty('replayPerformance') ?: false}"
			vmArg "-Dzsgrooms.replayPrototype.benchmark=${project.findProperty('replayCaptureBenchmark') ?: false}"
			vmArg "-Dzsgrooms.replayPrototype.smokeKeepSeedChanges=${project.findProperty('replayKeepSeedChanges') ?: false}"
			vmArg "-Dzsgrooms.replayTempleSmoke=${project.findProperty('replayTempleSmoke') ?: false}"
			if (project.hasProperty('replayRecorderJfr')) {
				vmArg '-Xms512m'
				vmArg '-Xmx1536m'
				vmArg "-XX:StartFlightRecording=filename=${file(project.property('replayRecorderJfr')).absolutePath},settings=profile,dumponexit=true"
			}
		}
		perchBenchmark {
			server()
			name = "Dragon Perch Benchmark"
			runDir = "run/perch-benchmark"
			vmArg "-Dzsgrooms.perchBenchmark=true"
			vmArg "-Dzsgrooms.perchBenchmark.trials=${project.findProperty('perchTrials') ?: 10}"
			vmArg "-Dzsgrooms.perchBenchmark.crystals=${project.findProperty('perchCrystals') ?: 10}"
			vmArg "-Dzsgrooms.perchBenchmark.maxTicks=${project.findProperty('perchMaxTicks') ?: 12000}"
			vmArg "-Dzsgrooms.perchBenchmark.sampleSeed=${project.findProperty('perchSampleSeed') ?: 6505258691473851208}"
			vmArg "-Dzsgrooms.perchBenchmark.compareGrace=${project.findProperty('perchCompareGrace') ?: false}"
			programArg "--port=0"
			programArg "nogui"
		}
		woodLightingTest {
			server()
			name = "Wood Lighting Integration Test"
			runDir = "run/perch-benchmark"
			vmArg "-Dzsgrooms.woodLightingTest=true"
			programArg "--port=0"
			programArg "nogui"
		}
		netherEntryTest {
			server()
			name = "Shared Nether Entry Integration Test"
			runDir = "run/perch-benchmark"
			vmArg "-Dzsgrooms.netherEntryTest=true"
			programArg "--port=0"
			programArg "nogui"
		}
		netherPreloadBenchmark {
			server()
			name = "Nether Preload Benchmark"
			runDir = project.findProperty('preloadDirectory') ?: 'run/nether-preload-benchmark'
			vmArg '-Dzsgrooms.netherPreloadBenchmark=true'
			vmArg "-Dzsgrooms.netherPreloadBenchmark.mode=${project.findProperty('preloadMode') ?: 'current'}"
			vmArg "-Dzsgrooms.netherPreloadBenchmark.trials=${project.findProperty('preloadTrials') ?: 4}"
			vmArg "-Dzsgrooms.netherPreloadBenchmark.expectReady=${project.findProperty('preloadExpectReady') ?: false}"
			vmArg '-Xms512m'
			vmArg '-Xmx1536m'
			vmArg '-XX:ActiveProcessorCount=4'
			programArg '--port=0'
			programArg 'nogui'
		}
	}
}

version = project.mod_version
group = project.maven_group

def viewerProperties = new Properties()
file('replay-viewer/gradle.properties').withInputStream { viewerProperties.load(it) }
ext.replayViewerVersion = project.findProperty('viewer_version') ?: viewerProperties.getProperty('viewer_version')

repositories {
	// Local libs folder for FSG-Mod and other JARs
	flatDir { dirs 'libs' }
	mavenLocal()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// FSG-Mod: Drop JAR in libs/ folder, it will be picked up automatically
	modCompileOnly fileTree(dir: 'libs', include: '*.jar')
	if (project.findProperty('replayTimer') == 'true') {
		modRuntimeOnly fileTree(dir: 'libs', include: 'SpeedRunIGT-*.jar')
	}
	if (project.findProperty('replayAtum') == 'true') {
		modRuntimeOnly fileTree(dir: 'libs', include: '*.jar')
	}
	if (project.hasProperty('replayPlaybackFile')) {
		modRuntimeOnly files('replay-prototype/build/reference/replaymod-1.16.1-2.6.27.jar')
		if (project.findProperty('replayViewer') == 'true') {
			modRuntimeOnly files(project.findProperty('replayViewerJar') ?: "replay-viewer/build/libs/zsg-replay-viewer-${replayViewerVersion}.jar")
		}
		if (project.findProperty('replayPlaybackMods') == 'true') {
			modRuntimeOnly fileTree(dir: 'run/replay-playback-test/reference-mods', include: '*.jar',
					excludes: (project.findProperty('replayPlaybackExclude') ?: '').split(',').findAll { !it.isEmpty() })
		}
	}

	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Test-only viewer driver; neither it nor ReplayMod is packaged in the ZSG release.
if (project.hasProperty('replayPlaybackFile')) {
	sourceSets {
		replayPlaybackTest {
			compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + sourceSets.main.runtimeClasspath
			runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
		}
	}
	loom {
		mods {
			'zsg-rooms' { sourceSet sourceSets.main }
			'zsg-replay-playback-test' { sourceSet sourceSets.replayPlaybackTest }
		}
		runs {
			replayPlaybackTest {
				client()
				source sourceSets.replayPlaybackTest
				runDir 'run/replay-playback-test'
				vmArg "-Dzsgrooms.replayPlaybackFile=${project.property('replayPlaybackFile')}"
				vmArg "-Dzsgrooms.viewerProfile=${project.findProperty('viewerProfile') ?: false}"
				vmArg "-Dzsgrooms.viewerSeekProfile=${project.findProperty('viewerSeekProfile') ?: false}"
				vmArg "-Dzsgrooms.viewerSeekBatchLights=${project.findProperty('viewerSeekBatchLights') ?: false}"
				vmArg "-Dzsgrooms.viewerSeekFast=${project.findProperty('viewerSeekFast') ?: false}"
				vmArg "-Dzsgrooms.viewerProfileColdIndexes=${project.findProperty('viewerProfileColdIndexes') ?: false}"
				vmArg "-Dzsgrooms.viewerProfileOutput=${file(project.findProperty('viewerProfileOutput') ?: 'run/viewer-performance/baseline.jsonl').absolutePath}"
				if (project.hasProperty('viewerProfileJfr')) {
					vmArg '-Xms512m'
					vmArg '-Xmx2g'
					vmArg "-XX:StartFlightRecording=filename=${file(project.property('viewerProfileJfr')).absolutePath},settings=profile,dumponexit=true"
				}
				vmArg "-Dzsgrooms.replayPlaybackEnd=${project.findProperty('replayPlaybackEnd') ?: 118000}"
				vmArg "-Dzsgrooms.replayViewerSmoke=${project.findProperty('replayViewerSmoke') ?: false}"
				vmArg "-Dzsgrooms.replayHighlightSmoke=${project.findProperty('replayHighlightSmoke') ?: false}"
				vmArg "-Dzsgrooms.replayRaceSmoke=${project.findProperty('replayRaceSmoke') ?: false}"
				vmArg "-Dzsgrooms.replayStartupSmoke=${project.findProperty('replayStartupSmoke') ?: false}"
				vmArg "-Dzsgrooms.replayDetailsSmoke=${project.findProperty('replayDetailsSmoke') ?: false}"
				vmArg "-Dzsgrooms.replayChestSmoke=${project.findProperty('replayChestSmoke') ?: false}"
				vmArg "-Dzsgrooms.replayTempleSmoke=${project.findProperty('replayTempleSmoke') ?: false}"
			}
		}
	}
}

// Copy FSG-Mod JAR to run/mods so Fabric Loader can detect it at runtime
task copyFsgModToRunMods {
	doLast {
		fileTree(dir: 'libs', include: '*.jar').each { file ->
			copy {
				from file
				into 'run/mods'
			}
		}
	}
}

build.dependsOn copyFsgModToRunMods
apply from: 'gradle/release.gradle'
if (project.hasProperty('filterPickerTest')) {
	apply from: 'gradle/filter-picker-test.gradle'
}
runClient.dependsOn copyFsgModToRunMods

processResources {
	dependsOn gradle.includedBuild('zsg-replay-library-probe').task(':writerBundle')
	from('replay-prototype/build/writer-bundle') {
		into 'assets/zsg-rooms/replay'
	}
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 8
}

test {
	useJUnitPlatform()
}

tasks.register('raceRelayTest', Test) {
	description = 'Opt-in race/reconnect integration tests against a local relay only.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter { includeTestsMatching 'zsgrooms.modid.net.RaceRelayIntegrationTest' }
	systemProperty 'zsgrooms.testRelay', project.findProperty('testRelay') ?: 'http://127.0.0.1:8799'
	workingDir file('run/relay-race-test')
	doFirst { workingDir.mkdirs() }
	maxHeapSize = '512m'
	maxParallelForks = 1
	outputs.upToDateWhen { false }
	testLogging { showStandardStreams = true }
}

tasks.register('recentOptimizationBenchmark', Test) {
	description = 'Opt-in CPU/allocation comparisons for spawn counters and tournament presentation data.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter { includeTestsMatching '*OptimizationBenchmark' }
	systemProperty 'zsgrooms.optimizationBenchmark', 'true'
	if (project.hasProperty('testJava')) executable = project.property('testJava')
	maxHeapSize = '512m'
	maxParallelForks = 1
	outputs.upToDateWhen { false }
	testLogging { showStandardStreams = true }
}

tasks.register('replayRecorderBenchmark', Test) {
	description = 'Opt-in recorder cost/equivalence experiments; does not change production capture.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter { includeTestsMatching 'zsgrooms.modid.replay.ReplayRecorderBenchmark' }
	systemProperty 'zsgrooms.recorderBenchmark', 'true'
	maxHeapSize = '512m'
	maxParallelForks = 1
	outputs.upToDateWhen { false }
	testLogging { showStandardStreams = true }
}

// Developer-only terrain probe. It is not included in the release JAR or run during races.
if (project.hasProperty('filterProbe')) {
	apply from: 'gradle/filter-probe.gradle'
}

tasks.named('runPerchBenchmark') {
	doFirst { ext.testStartedAt = System.currentTimeMillis() }
	doLast {
		def log = file('run/perch-benchmark/logs/latest.log')
		if (!log.exists() || log.lastModified() < testStartedAt
				|| !log.text.contains('[PerchBenchmark] PASS:')
				|| log.text.contains('[PerchBenchmark] Could not start')
				|| log.text.contains('[PerchBenchmark] Failed')) {
			throw new GradleException('Dragon perch benchmark failed; see run/perch-benchmark/logs/latest.log')
		}
	}
}

tasks.named('runWoodLightingTest') {
	doFirst {
		ext.testStartedAt = System.currentTimeMillis()
	}
	doLast {
		def log = file('run/perch-benchmark/logs/latest.log')
		if (!log.exists() || log.lastModified() < testStartedAt
				|| !log.text.contains('[WoodLightTest] PASS:') || log.text.contains('[WoodLightTest] FAIL')) {
			throw new GradleException('Wood lighting integration test did not pass; see run/perch-benchmark/logs/latest.log')
		}
	}
}

tasks.named('runNetherEntryTest') {
	doFirst { ext.testStartedAt = System.currentTimeMillis() }
	doLast {
		def log = file('run/perch-benchmark/logs/latest.log')
		if (!log.exists() || log.lastModified() < testStartedAt
				|| !log.text.contains('[NetherEntryTest] PASS:') || log.text.contains('[NetherEntryTest] FAIL')) {
			throw new GradleException('Shared Nether entry test did not pass; see run/perch-benchmark/logs/latest.log')
		}
	}
}

tasks.named('runNetherPreloadBenchmark') {
	doFirst {
		ext.testStartedAt = System.currentTimeMillis()
		def dir = file(project.findProperty('preloadDirectory') ?: 'run/nether-preload-benchmark')
		if (new File(dir, 'world').exists()) {
			throw new GradleException('Preload benchmark requires a fresh directory; set -PpreloadDirectory=run/...')
		}
		dir.mkdirs()
		new File(dir, 'eula.txt').text = file('run/perch-benchmark/eula.txt').text
		def properties = new Properties()
		properties.setProperty('level-seed', (project.findProperty('preloadSeed') ?: '7338020334776386520').toString())
		properties.setProperty('online-mode', 'false')
		properties.setProperty('view-distance', '8')
		properties.setProperty('server-ip', '127.0.0.1')
		new File(dir, 'server.properties').withOutputStream { properties.store(it, 'Isolated preload benchmark') }
	}
	doLast {
		def dir = file(project.findProperty('preloadDirectory') ?: 'run/nether-preload-benchmark')
		def log = new File(dir, 'logs/latest.log')
		if (!log.exists() || log.lastModified() < testStartedAt
				|| !log.text.contains('[NetherPreloadBench] PASS') || log.text.contains('[NetherPreloadBench] FAIL')) {
			throw new GradleException("Preload benchmark failed; see ${log}")
		}
	}
}

tasks.named('runReplayPrototype') {
	doFirst {
		ext.testStartedAt = System.currentTimeMillis()
	}
	doLast {
		if (project.findProperty('replaySmoke') == 'true') {
			def log = file('run/replay-prototype/logs/latest.log')
			if (!log.exists() || log.lastModified() < testStartedAt
					|| !log.text.contains('[ReplaySmoke] PASS:') || log.text.contains('[ReplaySmoke] FAIL:')
					|| log.text.contains('[ReplayPrototype] Recording stopped:')) {
				throw new GradleException('Replay capture smoke test failed; see run/replay-prototype/logs/latest.log')
			}
		}
	}
}

tasks.matching { it.name == 'runReplayPlaybackTest' }.configureEach {
	if (project.hasProperty('viewerProfileJava')) executable = project.property('viewerProfileJava')
	doFirst { ext.testStartedAt = System.currentTimeMillis() }
	doLast {
		if (project.findProperty('viewerSeekProfile') == 'true') {
			def log = file('run/replay-playback-test/logs/latest.log')
			if (!log.exists() || log.lastModified() < testStartedAt || !log.text.contains('[ViewerSeekProfile] PASS')
					|| log.text.contains('[ViewerSeekProfile] FAIL')) throw new GradleException('Viewer seeking profile did not complete')
		}
		if (project.findProperty('viewerProfile') == 'true') {
			def log = file('run/replay-playback-test/logs/latest.log')
			if (!log.exists() || log.lastModified() < testStartedAt || !log.text.contains('[ViewerProfile] PASS')
					|| log.text.contains('[ViewerProfile] FAIL')) throw new GradleException('Viewer profiling did not complete')
		}
		if (project.findProperty('replayViewerSmoke') == 'true' || project.findProperty('replayRaceSmoke') == 'true'
				|| project.findProperty('replayStartupSmoke') == 'true' || project.findProperty('replayDetailsSmoke') == 'true'
				|| project.findProperty('replayChestSmoke') == 'true' || project.findProperty('replayTempleSmoke') == 'true'
				|| project.findProperty('replayHighlightSmoke') == 'true') {
			def marker = project.findProperty('replayHighlightSmoke') == 'true' ? '[MobHighlightSmoke] PASS:'
					: project.findProperty('replayTempleSmoke') == 'true' ? '[ReplayTempleSmoke] PASS:'
					: project.findProperty('replayChestSmoke') == 'true' ? '[ReplayChestSmoke] PASS:'
					: project.findProperty('replayDetailsSmoke') == 'true' ? '[ReplayDetailsSmoke] PASS:'
					: project.findProperty('replayStartupSmoke') == 'true' ? '[ReplayStartupSmoke] PASS:'
					: project.findProperty('replayRaceSmoke') == 'true' ? '[ReplayRaceSmoke] PASS:' : '[ReplayViewerSmoke] PASS:'
			def log = file('run/replay-playback-test/logs/latest.log')
			if (!log.exists() || log.lastModified() < testStartedAt
					|| !log.text.contains(marker)
					|| project.findProperty('replayViewerSmoke') == 'true' && !log.text.contains('[ReplayAnalysisSmoke] PASS:')
					|| log.text.contains('[ReplayPlaybackTest] Failed')) {
				throw new GradleException('Replay viewer smoke failed; see replay-playback-test/logs/latest.log')
			}
		}
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
